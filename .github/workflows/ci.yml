name: CI

# Type check, lint and tests for the Electron app and the Python tools server.
# Runs on pull requests and on pushes to main, and release.yml calls it so a
# tag with failing checks never reaches the installer build.

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  app:
    name: App (tsc, lint, Vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: electron-app
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node 22
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: electron-app/package-lock.json

      - name: Install node deps
        run: npm ci

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Vitest
        run: npm test

  tools-server:
    name: Tools server (Ruff, unittest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tts-server
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            tts-server/requirements-tools.txt
            tts-server/requirements-dev.txt

      - name: Install Python deps
        run: python -m pip install -r requirements-tools.txt -r requirements-dev.txt

      - name: Ruff
        run: python -m ruff check .

      - name: unittest
        run: python -m unittest discover -p "test_*.py"
