name: Release

# Pushing a tag (e.g. v2.10.0) -> builds Windows + Linux and publishes a GitHub Release.
# Manual runs (workflow_dispatch) build artifacts only (no publish).
#
# Why two OSes: PyInstaller cannot cross-compile, so voidcast-tools-server.exe is
# frozen on Windows and voidcast-tools-server on Linux.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: ubuntu-latest
            platform: linux

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node 22
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: electron-app/package-lock.json

      - name: Setup Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tts-server/requirements-tools.txt

      - name: Repo venv + tools deps
        shell: bash
        run: |
          set -euo pipefail
          python -m venv .venv
          if [ -x .venv/bin/python ]; then
            PY=".venv/bin/python"
          else
            PY=".venv/Scripts/python.exe"
          fi
          echo "Tools binary se gradi sa: $PY"
          "$PY" -m pip install --upgrade pip
          "$PY" -m pip install -r tts-server/requirements-tools.txt pyinstaller

      - name: Install node deps
        working-directory: electron-app
        run: npm ci

      - name: Build (Windows)
        if: matrix.platform == 'windows'
        working-directory: electron-app
        run: npm run build:ci

      - name: Build (Linux)
        if: matrix.platform == 'linux'
        run: bash build-linux.sh "--publish never"

      - name: Upload installers
        uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.platform }}
          if-no-files-found: error
          retention-days: 7
          # Top level of release/<version>/ only: win-unpacked/ and linux-unpacked/ hold loose
          # binaries (Voidcast.exe, rg.exe, the tools server) that must not reach the release.
          path: |
            electron-app/release/*/*_Setup.exe
            electron-app/release/*/*.blockmap
            electron-app/release/*/*.AppImage
            electron-app/release/*/*.deb
            electron-app/release/*/latest*.yml

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Verify tag matches package.json version
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./electron-app/package.json').version")"
          echo "tag=$TAG  electron-app/package.json=$PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag v$TAG does not match version $PKG in electron-app/package.json"
            exit 1
          fi

      - name: Download installers
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      # Artifacts unpack into a subfolder (dist/<version>/...), hence the recursive globs.
      - name: List
        run: find dist -type f | sort

      # To review before publishing: set draft: true.
      - name: Create / update release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/**/*_Setup.exe
            dist/**/*.blockmap
            dist/**/*.AppImage
            dist/**/*.deb
            dist/**/latest*.yml
          fail_on_unmatched_files: true
          generate_release_notes: true
          draft: false
