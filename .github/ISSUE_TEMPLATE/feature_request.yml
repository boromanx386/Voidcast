name: Feature request
description: Suggest an idea or an improvement.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe what you are trying to do and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like to happen?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or workarounds
      description: Anything you tried, or how other tools handle it.
  - type: checkboxes
    id: contribute
    attributes:
      label: Contributing
      options:
        - label: I would like to send a PR for this (see CONTRIBUTING.md)
